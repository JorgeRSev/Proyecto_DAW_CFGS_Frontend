<div
  class="pp-card flex flex-col justify-between h-full"
  [class.ring-2]="popular"
  [style.ring-color]="popular ? 'var(--pp-amber)' : ''"
  [style.border-color]="popular ? 'var(--pp-amber)' : 'var(--pp-border)'"
  style="position: relative; transition: box-shadow 0.2s"
  [style.box-shadow]="popular ? '0 4px 20px rgba(239,159,39,0.18)' : 'none'"
>
  @if (popular) {
    <div
      style="
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--pp-amber);
        color: #412402;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 12px;
        border-radius: 20px;
        white-space: nowrap;
      "
    >
      ⭐ Más popular
    </div>
  }

  <div>
    <h3 class="text-lg font-semibold mb-1" style="color: var(--pp-text)">
      {{ title }}
    </h3>

    <p class="text-3xl font-bold mb-4" style="color: var(--pp-blue)">
      {{ price }}
      <span class="text-base font-normal" style="color: var(--pp-text-soft)">/ visita</span>
    </p>

    <ul class="space-y-1 mb-4">
      @for (f of features; track f) {
        <li class="flex items-center gap-2" style="font-size: 14px; color: var(--pp-text-soft)">
          <span style="color: var(--pp-amber); font-size: 13px">✓</span> {{ f }}
        </li>
      }
    </ul>
  </div>

  <button
    (click)="action()"
    [class]="popular ? 'pp-btn-primary' : 'pp-btn-outline'"
    style="width: 100%; padding: 10px"
  >
    {{ buttonText }}
  </button>
</div>
