<nav style="background: var(--pp-white); border-bottom: 1px solid var(--pp-border)">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2 cursor-pointer select-none" routerLink="/">
      <span style="display: flex; gap: 3px; align-items: center">
        <span
          style="
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pp-amber);
            display: inline-block;
          "
        ></span>
        <span
          style="
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pp-blue);
            display: inline-block;
            margin-left: -3px;
          "
        ></span>
      </span>
      <span class="font-semibold text-lg" style="color: var(--pp-text)">PeluPatas</span>
    </div>

    <div class="hidden md:flex gap-8">
      <a
        routerLink="/"
        routerLinkActive="font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        style="font-size: 14px; color: var(--pp-text-soft); text-decoration: none"
        class="hover:text-blue-600 transition-colors"
      >
        Inicio
      </a>
      <a
        href="#servicios"
        style="font-size: 14px; color: var(--pp-text-soft); text-decoration: none"
        class="hover:text-blue-600 transition-colors"
      >
        Servicios
      </a>
      <a
        routerLink="/contacto"
        style="font-size: 14px; color: var(--pp-text-soft); text-decoration: none"
        class="hover:text-blue-600 transition-colors"
      >
        Contacto
      </a>
    </div>

    <div class="flex items-center gap-3">
      @if (!authService.isLoggedIn()) {
        <a
          routerLink="/login"
          style="font-size: 14px; color: var(--pp-text-soft); text-decoration: none"
          class="hover:text-blue-600 transition-colors"
        >
          Entrar
        </a>
        <a routerLink="/register" class="pp-btn-primary" style="text-decoration: none">
          Pide tu cita
        </a>
      } @else {
        <a
          routerLink="/dashboard"
          style="font-size: 14px; color: var(--pp-text-soft); text-decoration: none"
          class="hover:text-blue-600 transition-colors"
        >
          Mi área
        </a>
        <button
          (click)="logout()"
          style="
            background: transparent;
            border: 1px solid var(--pp-blue-soft);
            color: var(--pp-blue-dark);
            font-size: 14px;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
          "
        >
          Cerrar sesión
        </button>
      }
    </div>
  </div>
</nav>
