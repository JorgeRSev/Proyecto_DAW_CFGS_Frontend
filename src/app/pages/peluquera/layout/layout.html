<div class="flex h-screen bg-gray-100">
  <aside class="w-64 bg-white shadow-md flex flex-col justify-between">
    <div>
      <div class="p-6 font-bold text-xl border-b flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-500"></span>
        PeluPatas
      </div>

      <div class="px-4 pt-3 pb-1">
        <span class="text-xs font-medium text-green-600 uppercase tracking-wide">
          Área peluquera
        </span>
      </div>

      <nav class="p-4 space-y-1 text-gray-700">
        <a
          routerLink="citas"
          routerLinkActive="bg-green-50 text-green-700 font-medium"
          class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors"
        >
          📋 Gestión de citas
        </a>

        <a
          routerLink="calendario"
          routerLinkActive="bg-green-50 text-green-700 font-medium"
          class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors"
        >
          📅 Calendario
        </a>
      </nav>
    </div>

    <div class="p-4 border-t">
      <p class="text-xs text-gray-400 mb-3 truncate">{{ user?.email }}</p>
      <button
        (click)="logout()"
        class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition-colors text-sm"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm px-6 py-4">
      <h2 class="font-semibold text-gray-700">Hola, {{ user?.nombre || user?.email }}</h2>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
