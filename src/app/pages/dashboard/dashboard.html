<div class="flex h-screen" style="background: var(--pp-blue-bg)">
  <aside
    style="
      width: 220px;
      background: var(--pp-white);
      border-right: 1px solid var(--pp-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    "
  >
    <div>
      <div
        style="
          padding: 1.25rem 1.25rem 1rem;
          border-bottom: 1px solid var(--pp-border);
          display: flex;
          align-items: center;
          gap: 6px;
        "
      >
        <span
          style="
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pp-amber);
            display: inline-block;
          "
        ></span>
        <span
          style="
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pp-blue);
            display: inline-block;
            margin-left: -3px;
          "
        ></span>
        <span style="font-size: 16px; font-weight: 600; color: var(--pp-text); margin-left: 4px"
          >PeluPatas</span
        >
      </div>

      <div style="padding: 1rem 1.25rem 0.5rem">
        <p style="font-size: 12px; color: var(--pp-text-muted)">Bienvenido,</p>
        <p style="font-size: 14px; font-weight: 600; color: var(--pp-text)">
          {{ user?.nombre || user?.email }}
        </p>
      </div>

      <nav style="padding: 0.5rem 0.75rem; display: flex; flex-direction: column; gap: 2px">
        <a routerLink="pedir-cita" routerLinkActive="active-nav-link" class="nav-link-item">
          <span style="font-size: 16px">📅</span>
          Pedir cita
        </a>

        <a routerLink="citas" routerLinkActive="active-nav-link" class="nav-link-item">
          <span style="font-size: 16px">🐾</span>
          Mis citas
        </a>

        <a routerLink="mascotas" routerLinkActive="active-nav-link" class="nav-link-item">
          <span style="font-size: 16px">🐶</span>
          Mis mascotas
        </a>

        <a routerLink="perfil" routerLinkActive="active-nav-link" class="nav-link-item">
          <span style="font-size: 16px">👤</span>
          Mi perfil
        </a>
      </nav>
    </div>

    <div style="padding: 1rem 1.25rem; border-top: 1px solid var(--pp-border)">
      <p
        style="
          font-size: 11px;
          color: var(--pp-text-muted);
          margin-bottom: 8px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        "
      >
        {{ user?.email }}
      </p>
      <button
        (click)="logout()"
        style="
          width: 100%;
          padding: 8px;
          font-size: 13px;
          border-radius: 8px;
          cursor: pointer;
          background: transparent;
          border: 1px solid var(--pp-blue-soft);
          color: var(--pp-blue-dark);
          transition: all 0.15s;
        "
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden">
    <header
      style="
        background: var(--pp-white);
        border-bottom: 1px solid var(--pp-border);
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      "
    >
      <div>
        <h2 style="font-size: 16px; font-weight: 600; color: var(--pp-text)">
          Hola, {{ user?.nombre || user?.email }}
        </h2>
        <p style="font-size: 12px; color: var(--pp-text-muted)">
          Gestiona tus citas y mascotas desde aquí
        </p>
      </div>
      <span class="pp-badge pp-badge-blue">Cliente</span>
    </header>

    <main style="flex: 1; overflow-y: auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<style>
  .nav-link-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--pp-text-soft);
    text-decoration: none;
    transition: all 0.15s;
  }
  .nav-link-item:hover {
    background: var(--pp-blue-bg);
    color: var(--pp-blue-dark);
  }
  .active-nav-link {
    background: var(--pp-blue-bg) !important;
    color: var(--pp-blue-navy) !important;
    font-weight: 600;
    border-right: 3px solid var(--pp-blue);
    border-radius: 8px 0 0 8px;
  }
</style>
