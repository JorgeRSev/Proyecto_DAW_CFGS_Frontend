<section id="servicios" style="background: var(--pp-white); padding: 5rem 0">
  <div class="max-w-7xl mx-auto px-6">
    <div class="text-center mb-12">
      <span class="pp-badge pp-badge-blue" style="margin-bottom: 0.75rem; display: inline-block">
        Nuestros servicios
      </span>
      <h2 class="text-3xl font-bold" style="color: var(--pp-text)">Elige el paquete perfecto</h2>
      <p
        class="mt-3"
        style="color: var(--pp-text-soft); max-width: 480px; margin-left: auto; margin-right: auto"
      >
        Todos los paquetes incluyen atención personalizada y productos de primera calidad.
      </p>
    </div>

    <div class="grid gap-8 md:grid-cols-3" style="padding-top: 1rem">
      @for (p of packages; track p.title) {
        <app-card
          [title]="p.title"
          [price]="p.price"
          [features]="p.features"
          [popular]="p.popular ?? false"
          buttonText="Reservar"
          [action]="goToBooking.bind(this)"
        >
        </app-card>
      }
    </div>
  </div>
</section>
