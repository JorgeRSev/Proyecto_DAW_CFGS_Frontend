<section
  style="
    background: linear-gradient(135deg, var(--pp-amber-bg) 0%, var(--pp-blue-bg) 100%);
    padding: 5rem 1.5rem;
  "
>
  <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-10">
    <div class="flex-1">
      <span class="pp-badge pp-badge-amber" style="margin-bottom: 1rem; display: inline-block">
        🐾 Peluquería canina profesional
      </span>

      <h1
        class="text-4xl md:text-5xl font-bold leading-tight mb-4"
        style="color: var(--pp-blue-navy)"
      >
        Tu peludo se merece<br />verse y sentirse bien
      </h1>

      <p
        class="text-lg mb-8"
        style="color: var(--pp-text-soft); max-width: 480px; line-height: 1.7"
      >
        Reserva tu cita en segundos. Cuidamos a tu mascota con cariño, profesionalidad y mucho mimo.
      </p>

      <div class="flex gap-3 flex-wrap">
        <button
          (click)="goToBooking()"
          class="pp-btn-primary"
          style="font-size: 15px; padding: 11px 26px"
        >
          Pide tu cita
        </button>
        <a
          href="#servicios"
          class="pp-btn-outline"
          style="font-size: 15px; padding: 11px 26px; text-decoration: none"
        >
          Ver servicios ↓
        </a>
      </div>
    </div>

    <div
      class="hidden md:flex items-center justify-center flex-shrink-0"
      style="
        width: 440px;
        height: 400px;
        background: var(--pp-blue-bg);
        border-radius: 24px;
        border: 1px solid var(--pp-border);
      "
    >
      <img src="/beautiful-pet-portrait-dog.jpg" alt="Imagen de perro en la pelu" style="
      width: 100%;
      height: 100%;
      border-radius: 24px;
      object-fit: cover;
    "  />
    </div>
  </div>
</section>
