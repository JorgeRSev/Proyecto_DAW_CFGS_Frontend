<div class="flex h-screen bg-gray-100">
  <aside class="w-64 bg-gray-900 text-gray-100 flex flex-col justify-between">
    <div>
      <div class="p-6 font-bold text-xl border-b border-gray-700 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        PeluPatas
      </div>

      <div class="px-4 pt-3 pb-1">
        <span class="text-xs font-medium text-red-400 uppercase tracking-wide">
          Administración
        </span>
      </div>

      <nav class="p-4 space-y-1">
        <a
          routerLink="estadisticas"
          routerLinkActive="bg-gray-700 text-white"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors"
        >
          📊 Estadísticas
        </a>

        <a
          routerLink="usuarios"
          routerLinkActive="bg-gray-700 text-white"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition-colors"
        >
          👥 Usuarios
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-gray-700">
      <p class="text-xs text-gray-500 mb-3 truncate">{{ user?.email }}</p>
      <button
        (click)="logout()"
        class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition-colors text-sm"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
      <h2 class="font-semibold text-gray-700">Panel de administración</h2>
      <span class="text-sm text-gray-400">{{ user?.nombre || user?.email }}</span>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
