<div class="p-6 space-y-6">

  <div>
    <h1 class="text-2xl font-bold">Mis citas</h1>
    <p class="text-gray-600">Gestiona tus próximas citas con PeluPatas</p>
  </div>

  <div class="grid gap-4">
    @for (cita of citas; track cita.fecha) {
      <div class="bg-white p-5 rounded shadow flex justify-between items-center">
        <div>
          <p class="font-semibold">
            🐾 {{ cita.mascota }}
          </p>

          <p class="text-gray-600">
            📅 {{ cita.fecha }} - 🕒 {{ cita.hora }}
          </p>
        </div>
        <span
          class="px-3 py-1 rounded text-sm"
          [class.bg-green-100]="cita.estado === 'Confirmada'"
          [class.text-green-700]="cita.estado === 'Confirmada'"
          [class.bg-yellow-100]="cita.estado === 'Pendiente'"
          [class.text-yellow-700]="cita.estado === 'Pendiente'"
        >
          {{ cita.estado }}
        </span>
      </div>
    }
  </div>
</div>
