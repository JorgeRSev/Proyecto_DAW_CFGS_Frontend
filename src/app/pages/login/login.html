<div
  style="
    min-height: 80vh;
    background: linear-gradient(135deg, var(--pp-amber-bg) 0%, var(--pp-blue-bg) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  "
>
  <div class="pp-card" style="width: 100%; max-width: 400px; padding: 2.5rem">
    <div
      style="
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
        margin-bottom: 1.75rem;
      "
    >
      <span
        style="
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--pp-amber);
          display: inline-block;
        "
      ></span>
      <span
        style="
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--pp-blue);
          display: inline-block;
          margin-left: -3px;
        "
      ></span>
      <span style="font-size: 18px; font-weight: 600; color: var(--pp-text); margin-left: 4px"
        >PeluPatas</span
      >
    </div>

    <h2
      style="
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        color: var(--pp-text);
        margin-bottom: 6px;
      "
    >
      Bienvenido de nuevo
    </h2>
    <p
      style="
        text-align: center;
        font-size: 13px;
        color: var(--pp-text-soft);
        margin-bottom: 1.75rem;
      "
    >
      Accede a tu cuenta para gestionar tus citas
    </p>

    <form (ngSubmit)="onSubmit()">
      <div style="margin-bottom: 1rem">
        <label
          style="display: block; font-size: 13px; color: var(--pp-text-soft); margin-bottom: 5px"
        >
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="tu@email.com"
          style="
            width: 100%;
            padding: 9px 12px;
            font-size: 14px;
            border: 1px solid var(--pp-border);
            border-radius: 8px;
            background: var(--pp-white);
            color: var(--pp-text);
            outline: none;
            transition: border-color 0.15s;
          "
          (focus)="$event.target.style.borderColor = 'var(--pp-blue)'"
          (blur)="$event.target.style.borderColor = 'var(--pp-border)'"
        />
      </div>

      <div style="margin-bottom: 1.5rem">
        <label
          style="display: block; font-size: 13px; color: var(--pp-text-soft); margin-bottom: 5px"
        >
          Contraseña
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
          style="
            width: 100%;
            padding: 9px 12px;
            font-size: 14px;
            border: 1px solid var(--pp-border);
            border-radius: 8px;
            background: var(--pp-white);
            color: var(--pp-text);
            outline: none;
            transition: border-color 0.15s;
          "
          (focus)="$event.target.style.borderColor = 'var(--pp-blue)'"
          (blur)="$event.target.style.borderColor = 'var(--pp-border)'"
        />
      </div>

      @if (errorMsg) {
        <div
          style="
            background: #fdecea;
            border: 1px solid #f5adad;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #7b1e1e;
            margin-bottom: 1rem;
          "
        >
          {{ errorMsg }}
        </div>
      }

      <button
        type="submit"
        class="pp-btn-primary"
        style="width: 100%; padding: 11px; font-size: 15px"
      >
        Entrar
      </button>
    </form>

    <p style="text-align: center; font-size: 13px; color: var(--pp-text-soft); margin-top: 1.25rem">
      ¿No tienes cuenta?
      <a
        routerLink="/register"
        style="color: var(--pp-blue); font-weight: 500; text-decoration: none"
      >
        Regístrate aquí
      </a>
    </p>
  </div>
</div>
